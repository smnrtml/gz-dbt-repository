version: 2
sources:
  - name: raw
    schema: gz_raw_data
    description: Greenweez raw data from BigQuery
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: eşşiz product_id
        config:
          loaded_at_field: "CAST(date_date AS TIMESTAMP)"
          freshness:
            warn_after: {count: 90, period: day}
        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"
        columns:
          - name: date_date
          - name: orders_id
            description: foreign key
            tests:
              - not_null
          - name: pdt_id
            description: foreign key
            tests:
              - not_null
          - name: revenue
            tests:
              - not_null
          - name: quantity
              
                            
      - name: product
        identifier: raw_gz_product
        columns:
          - name: products_id
            description: primary key
            tests:
            - unique
            - not_null
          - name: purchse_price 
            
      - name: ship
        identifier: raw_gz_ship
        columns:
          - name: orders_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: shipping_fee
          - name: shipping_fee_1
          - name: logcost
          - name: ship_cost
              
      - name: adwords
        identifier: raw_gz_adwords
      - name: bing
        identifier: raw_gz_bing
      - name: criteo
        identifier: raw_gz_criteo
      - name: facebook
        identifier: raw_gz_facebook

models:
  - name: int_campaigns
    description: add adwords, bing, criteo, facebook datas
    tests:
      - unique:
          column_name: "(date_date || '-' || campaign_key)"
    columns:
      - name: date_date
        tests:
          - not_null
      - name: paid_source
        tests:
          - not_null
      - name: campaign_key
        tests:
          - not_null
      - name: campaign_name
        tests:
          - not_null
      - name: ads_cost
        tests:
          - not_null
      - name: impression
        tests:
          - not_null
      - name: click
        tests:
          - not_null  


  - name: int_campaigns_day
    description: Günlük bazda toplam reklam maliyeti, gösterim ve tıklama verileri.
    columns:
      - name: date_date
        description: primary key
        tests:
          - unique
          - not_null
      - name: ads_cost
        description: Günlük toplam reklam maliyeti.
        tests:
          - not_null
      - name: ads_impression
        description: Günlük toplam reklam gösterim sayısı.
        tests:
          - not_null
      - name: ads_clicks
        description: Günlük toplam reklam tıklama sayısı.
        tests:
          - not_null 


  - name: finance_campaigns_day
    description: Günlük finansal metrikler ile reklam kampanya maliyetlerini birleştiren mart görünümü.
    columns:
      - name: date
        description: İşlem ve kampanya tarihi (birincil anahtar).
        tests:
          - unique
          - not_null
      - name: ads_margin
        description: Operasyonel marjdan reklam maliyetinin çıkarılmasıyla elde edilen net reklam marjı.

  - name: finance_campaigns_month
    columns:
      - name: datemonth
        description: primary key
        tests:
          - unique
          - not_null
          
          
        

          
          
          
          
     
              